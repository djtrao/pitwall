<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c11" />
    <title>Pit Wall – Sim Lab</title>
    <style>
      :root { --bg: #0a0c11; --panel: #141821; --line: #252b37; --text: #eef1f6; --mut: #8b94a5; --acc: #e10600; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
      #app { max-width: 720px; margin: 0 auto; padding: 12px 16px 40px; }
      h1 { font-size: 24px; margin: 4px 0; }
      .sub { color: var(--mut); margin: 0 0 12px; font-size: 14px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      button, select { font: inherit; color: var(--text); background: #222935; border: 1px solid #343d4e; border-radius: 8px; padding: 10px 12px; min-height: 44px; }
      button.on { background: var(--text); color: var(--bg); }
      button.go { background: var(--acc); border: none; font-weight: 800; flex: 1; }
      canvas { width: 100%; display: block; border-radius: 8px; background: #0d1016; }
      .top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 18px; margin-bottom: 6px; }
      .banner { background: #ffd200; color: #000; font-weight: 900; text-align: center; border-radius: 8px; padding: 6px; margin-bottom: 6px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      td { padding: 4px 5px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      tr.me td { background: rgba(255, 210, 0, 0.12); font-weight: 700; }
      .chip { display: inline-block; width: 6px; height: 14px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
      .tyre { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; border: 3px solid; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; background: #111; }
      .mut { color: var(--mut); }
      #log div { font-size: 13px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
      .wet { height: 8px; border-radius: 4px; background: #0e1118; overflow: hidden; margin-top: 4px; }
      .wet i { display: block; height: 100%; background: linear-gradient(90deg, #3a7bd5, #00d2ff); }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>🏁 Pit Wall – Sim Lab</h1>
      <p class="sub">Milestone 1: the race engine. Watch AI teams race – your team (yellow) drives on autopilot.</p>
      <div class="panel">
        <div class="row" id="tracks"></div>
        <div class="row" style="margin-top: 6px">
          <span class="mut">Speed</span>
          <span id="speeds" class="row"></span>
          <button class="go" id="start">START RACE</button>
        </div>
      </div>
      <div class="panel">
        <div class="top"><span id="lap">Lap –</span><span id="wx" class="mut"></span></div>
        <div id="banner"></div>
        <canvas id="cv" width="700" height="520"></canvas>
        <div class="wet"><i id="wetbar" style="width: 0"></i></div>
      </div>
      <div class="panel"><table id="tower"></table></div>
      <div class="panel" id="log"></div>
    </div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
