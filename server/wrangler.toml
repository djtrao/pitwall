# Pit Wall game server on Cloudflare (free plan): one Durable Object per game room.
name = "pitwall-server"
main = "worker.ts"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# the free plan needs SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
